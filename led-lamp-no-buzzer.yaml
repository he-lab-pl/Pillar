# ============================================================================
# ESPHome Configuration for RGBCCT LED Lamp (No Buzzer Version)
# Board: ESP32-C3 Super Mini
# ============================================================================
# 
# Konfiguracja dla customowej lampy LED z obsługą:
# - 5 kanałów PWM (Red, Green, Blue, Cold White, Warm White)
# - 2 przyciski dotykowe TTP223
# - Efekty świetlne (zorza, tęcza, świeczka, max jasność)
# - Tryb AP do konfiguracji WiFi przez klienta
# ============================================================================

substitutions:
  device_name: "led-lamp-no-buzzer"
  friendly_name: "LED Lamp"
  # Częstotliwość PWM dla LED - 4000Hz dla lepszej pracy MOSFETów Logic Level (IRLZ44N)
  pwm_frequency: "4000Hz"
  ap_ssid: "LED Lamp Setup"
  ap_password: "12345678"
  wifi_ssid: "Orange_Swiatlowod_1E7A"
  wifi_password: "PGGL53KE4GXD"

# ============================================================================
# PODSTAWOWA KONFIGURACJA ESP32-C3
# ============================================================================

esphome:
  name: ${device_name}
  # Dodajemy suffix MAC do nazwy urządzenia dla unikalności
  # Ustawienie na false ułatwia wykrywanie w dashboardzie (stała nazwa hostname)
  name_add_mac_suffix: false
  
  # Kod inicjalizacyjny - uruchamia się przy starcie
  on_boot:
    priority: 600 # Bardzo wcześnie
    then:
      # Przy pierwszym uruchomieniu światło będzie wyłączone
      - light.turn_off: led_light


# Konfiguracja platformy ESP32-C3
# Od ESPHome 2025.x wymagany osobny blok esp32
esp32:
  board: esp32-c3-devkitm-1
  # Framework ESP-IDF - natywny, bardziej stabilny dla RTTTL na C3
  # Alternatywa: arduino
  framework:
    type: esp-idf

# ============================================================================
# KONFIGURACJA WiFi I SIECI
# ============================================================================

wifi:
  # Konfiguracja sieci
  networks:
    # 1. Główna sieć domowa (z substitutions)
    - ssid: "${wifi_ssid}"
      password: "${wifi_password}"


  # Domyślne ustawienia
  fast_connect: false
  # Usunięto power_save_mode: none, gdyż może powodować problemy z AP na C3
  output_power: 8.5dB
  
  # Wyłączamy automatyczny restart przy braku połączenia WiFi
  reboot_timeout: 0s
  
  # Konfiguracja Access Point
  ap:
    ssid: "${ap_ssid}"
    password: "${ap_password}"
    # ap_timeout: 0s
    # channel: 1
    manual_ip:
      static_ip: 192.168.4.1
      gateway: 192.168.4.1
      subnet: 255.255.255.0

# Konfiguracja Improv Wi-Fi over BLE
# Umożliwia wykrycie lampy przez Home Assistant (lub telefon) zaraz po podłączeniu do prądu
# i skonfigurowanie WiFi bez konieczności łączenia się z AP lampy.
esp32_improv:
  authorizer: none # Brak fizycznego przycisku do autoryzacji (działa automatycznie)

# Captive Portal - interfejs webowy do konfiguracji WiFi
# Otwiera się automatycznie po połączeniu z AP
captive_portal:

# API dla integracji z Home Assistant (bez klucza - szybkie parowanie)
api:
  reboot_timeout: 0s

# OTA (Over The Air) - aktualizacje przez WiFi
# Od ESPHome 2025.x wymaga platformy
ota:
  - platform: esphome
    password: !secret ota_password

# Logger - do debugowania (można wyłączyć w produkcji)
logger:
  level: INFO # Zmieniono na INFO dla odciążenia procesora i Wi-Fi
  # Dla ESP32-C3 Super Mini z natywnym USB używamy USB_CDC
  hardware_uart: USB_CDC

# Web server do szybkiego podglądu (logowanie basic)
web_server:
  port: 80

# ============================================================================
# WYJŚCIA PWM DLA KANAŁÓW LED
# ============================================================================

# Definiujemy 5 kanałów PWM dla RGBCCT
# Każdy kanał to osobne wyjście GPIO z konfiguracją PWM

output:
  # Kanał 1: Warm White (GPIO3)
  - platform: ledc
    pin: GPIO3
    frequency: ${pwm_frequency}
    id: output_warm_white
    
  # Kanał 2: Cold White (GPIO4)
  - platform: ledc
    pin: GPIO4
    frequency: ${pwm_frequency}
    id: output_cold_white
    
  # Kanał 3: Green (GPIO5)
  - platform: ledc
    pin: GPIO5
    frequency: ${pwm_frequency}
    id: output_green
    
  # Kanał 4: Red (GPIO6)
  - platform: ledc
    pin: GPIO6
    frequency: ${pwm_frequency}
    id: output_red
    
  # Kanał 5: Blue (GPIO10)
  - platform: ledc
    pin: GPIO10
    frequency: ${pwm_frequency}
    id: output_blue
    max_power: 0.8


# Zmienne globalne
globals:
  # Blokada przycisków (Child Lock)
  - id: buttons_locked
    type: bool
    restore_value: true
    initial_value: 'false'

  # Zmienne do przywracania koloru po mignięciu (Blokada)
  - id: saved_brightness
    type: float
    initial_value: '0.0'
  - id: saved_red
    type: float
    initial_value: '0.0'
  - id: saved_green
    type: float
    initial_value: '0.0'
  - id: saved_blue
    type: float
    initial_value: '0.0'
  - id: saved_cold_white
    type: float
    initial_value: '0.0'
  - id: saved_warm_white
    type: float
    initial_value: '0.0'
  - id: saved_state
    type: bool
    initial_value: 'false'

  # Zmienne do Minutnika (Sleep Timer)
  - id: sleep_timer_minutes
    type: int
    restore_value: false
    initial_value: '0'

# Przełącznik do sterowania dźwiękiem (USUNIĘTY)

switch:
  # Blokada przycisków (Child Lock)
  - platform: template
    name: "${friendly_name} Blokada Przycisków"
    id: buttons_lock_switch
    icon: "mdi:lock"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - globals.set:
          id: buttons_locked
          value: 'true'
      - logger.log: "Blokada przycisków WŁĄCZONA"
    turn_off_action:
      - globals.set:
          id: buttons_locked
          value: 'false'
      - logger.log: "Blokada przycisków WYŁĄCZONA"
    lambda: |-
      return id(buttons_locked);

# Minutnik do usypiania (Sleep Timer)
select:
  - platform: template
    name: "${friendly_name} Minutnik (Sleep)"
    id: sleep_timer
    icon: "mdi:timer-outline"
    optimistic: true
    options:
      - "Wyłączony"
      - "1 min"
      - "5 min"
      - "10 min"
      - "20 min"
      - "30 min"
      - "45 min"
      - "60 min"
      - "90 min"
    initial_option: "Wyłączony"
    set_action:
      - lambda: |-
          std::string sel = x;
          int minutes = 0;
          if (sel == "1 min") minutes = 1;
          else if (sel == "5 min") minutes = 5;
          else if (sel == "10 min") minutes = 10;
          else if (sel == "20 min") minutes = 20;
          else if (sel == "30 min") minutes = 30;
          else if (sel == "45 min") minutes = 45;
          else if (sel == "60 min") minutes = 60;
          else if (sel == "90 min") minutes = 90;
          
          if (minutes > 0) {
            id(sleep_timer_minutes) = minutes;
            ESP_LOGD("sleep_timer", "Uruchamiam timer na %d minut", minutes);
            id(timer_countdown).execute();
          } else {
            ESP_LOGD("sleep_timer", "Zatrzymuję timer");
            id(timer_countdown).stop();
          }

# Skrypt odliczający czas (z logowaniem co minutę)
script:
  - id: timer_countdown
    mode: restart
    then:
      - logger.log: "Timer: Start odliczania..."
      
      # Pętla odliczająca minuty
      - while:
          condition:
            lambda: 'return id(sleep_timer_minutes) > 0;'
          then:
            - logger.log: 
                format: "Do wyłączenia zostało %d minut"
                args: [ 'id(sleep_timer_minutes)' ]
            - delay: 60s
            - lambda: 'id(sleep_timer_minutes) -= 1;'
      
      - logger.log: "Czas minął! Wyłączanie efektów i wygaszanie..."
      
      # KROK 1: Wyłącz efekty
      - light.turn_on:
          id: led_light
          effect: "None"
      
      # KROK 2: Wygaś światło
      - light.turn_off:
          id: led_light
          transition_length: 60s
          
      # KROK 3: Reset selecta w HA
      - lambda: 'id(sleep_timer).publish_state("Wyłączony");'

  # ============================================================================
  # RESET WIFI / TRYB AP - SKRYPTY
  # ============================================================================

  # Włączenie obu kanałów białych na 100% przy starcie lampy
  - id: turn_on_whites
    mode: single
    then:
      - lambda: |-
          auto call = id(led_light).make_call();
          call.set_state(true);
          call.set_transition_length(0);
          call.set_red(0.0f);
          call.set_green(0.0f);
          call.set_blue(0.0f);
          call.set_cold_white(1.0f);
          call.set_warm_white(1.0f);
          call.set_brightness(1.0f);
          call.perform();
  
  # Potwierdzenie wizualne wejścia w tryb parowania (3 mignięcia niebieskim)
  - id: blink_blue_confirmation
    mode: single
    then:
      - repeat:
          count: 3
          then:
            - light.turn_on:
                id: led_light
                transition_length: 0.1s
                brightness: 100%
                red: 0%
                green: 0%
                blue: 100%
                cold_white: 0%
                warm_white: 0%
            - delay: 0.3s
            - light.turn_off:
                id: led_light
                transition_length: 0.1s
            - delay: 0.3s

  # Sygnalizacja zmiany blokady (3 mignięcia bursztynowe i powrót)
  - id: blink_amber_lock
    mode: single
    then:
      - lambda: |-
          // Zapisz obecny stan
          auto call = id(led_light).current_values;
          id(saved_state) = call.is_on();
          id(saved_brightness) = call.get_brightness();
          id(saved_red) = call.get_red();
          id(saved_green) = call.get_green();
          id(saved_blue) = call.get_blue();
          id(saved_cold_white) = call.get_cold_white();
          id(saved_warm_white) = call.get_warm_white();
      
      - repeat:
          count: 3
          then:
            - light.turn_on:
                id: led_light
                transition_length: 0.1s
                brightness: 100%
                # Bursztynowy (Amber): 100% Red, 75% Green
                red: 100%
                green: 75%
                blue: 0%
                cold_white: 0%
                warm_white: 0%
            - delay: 0.3s
            - light.turn_off:
                id: led_light
                transition_length: 0.1s
            - delay: 0.3s

      - lambda: |-
          // Przywróć stan
          if (id(saved_state)) {
            auto call = id(led_light).turn_on();
            call.set_transition_length(200);
            call.set_brightness(id(saved_brightness));
            call.set_red(id(saved_red));
            call.set_green(id(saved_green));
            call.set_blue(id(saved_blue));
            call.set_cold_white(id(saved_cold_white));
            call.set_warm_white(id(saved_warm_white));
            call.perform();
          } else {
            auto call = id(led_light).turn_off();
            call.set_transition_length(200);
            call.perform();
          }

  # Przełączanie blokady (logika)
  - id: toggle_button_lock
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(buttons_locked);'
          then:
            # UNLOCKING (Blokada była włączona -> wyłączamy)
            - switch.turn_off: buttons_lock_switch
            - script.execute: blink_amber_lock
          else:
            # LOCKING (Blokada była wyłączona -> włączamy)
            - switch.turn_on: buttons_lock_switch
            - script.execute: blink_amber_lock

  # Reset ustawień WiFi i restart (wymuszenie AP)
  - id: force_ap_mode
    mode: single
    then:
      - logger.log: "RESET WIFI - Czyszczenie danych i restart do trybu AP"
      
      # Wyczyszczenie zapisanych sieci WiFi z pamięci flash
      - lambda: |-
          // Czyścimy dane STA w pamięci trwałej
          wifi::global_wifi_component->save_wifi_sta("", "");
      
      - logger.log: "Dane wyczyszczone. Restart za 3 sekundy..."
      - script.execute: blink_blue_confirmation
      - delay: 3s
      - button.press: restart_button
  
  # Główny trigger przytrzymania obu przycisków
  # 10s -> Toggle Lock
  # 20s -> Reset WiFi (działa niezależnie od stanu blokady)
  - id: check_buttons_long_press
    mode: restart
    then:
      - logger.log: "Oba przyciski wciśnięte - start odliczania..."
      
      # Etap 1: Czekamy 10s na zmianę blokady
      - delay: 10s
      - if:
          condition:
            and:
              - binary_sensor.is_on: button_left
              - binary_sensor.is_on: button_right
          then:
            - logger.log: "10s minęło - Przełączanie blokady przycisków"
            - script.execute: toggle_button_lock
            
            # Etap 2: Czekamy kolejne 10s na reset WiFi (razem 20s)
            - delay: 10s
            - if:
                condition:
                  and:
                    - binary_sensor.is_on: button_left
                    - binary_sensor.is_on: button_right
                then:
                  - logger.log: "20s minęło - Uruchamianie Resetu WiFi"
                  - script.execute: force_ap_mode
          else:
            - logger.log: "Przyciski zwolniono przed upływem 10s"

# ============================================================================
# GŁÓWNE ŚWIATŁO RGBCCT
# ============================================================================

light:
  - platform: rgbww
    name: "${friendly_name}"
    id: led_light
    
    # Przypisanie kanałów do kolorów
    red: output_red
    green: output_green
    blue: output_blue
    cold_white: output_cold_white
    warm_white: output_warm_white
    
    # Temperatura kolorowa dla białych LED
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K
    
    # Wymuszenie rozdzielenia RGB i Białych kanałów
    # Gdy color_interlock: true, RGB i White nie mogą działać jednocześnie
    # Tworzy dwa tryby: RGB i COLD_WARM_WHITE
    color_interlock: true
    
    # Domyślna jasność i temperatura przy włączeniu
    default_transition_length: 1s
    
    # Restore mode - przywraca ostatni stan po restarcie
    restore_mode: RESTORE_DEFAULT_OFF
    
    # ========================================================================
    # EFEKTY ŚWIETLNE
    # ========================================================================
    effects:
      # ZORZA (Ultra Slow & Smooth)
      - lambda:
          name: "Zorza"
          update_interval: 2s # Bardzo rzadka aktualizacja (odciąża sieć)
          lambda: |-
            static float phase = 0.0;
            phase += 0.05;
            if (phase > 1.0) phase = 0.0;
            
            auto call = id(led_light).turn_on();
            call.set_state(true);
            call.set_transition_length(2000); // 2 sekundy płynnego przejścia
            
            if (phase < 0.25) {
              float sub_phase = phase * 4.0;
              call.set_rgb(0.5 * (1-sub_phase), 0.0, 1.0);
              call.set_cold_white(0.0); call.set_warm_white(0.0);
            } else if (phase < 0.5) {
              float sub_phase = (phase - 0.25) * 4.0;
              call.set_rgb(0.0, sub_phase, 1.0 * (1-sub_phase));
              call.set_cold_white(0.0); call.set_warm_white(0.0);
            } else if (phase < 0.75) {
              float sub_phase = (phase - 0.5) * 4.0;
              call.set_rgb(0.0, 1.0 * (1-sub_phase), 0.0);
              call.set_cold_white(sub_phase); call.set_warm_white(0.0);
            } else {
              float sub_phase = (phase - 0.75) * 4.0;
              call.set_rgb(0.5 * sub_phase, 0.0, 1.0 * sub_phase);
              call.set_cold_white(1.0 * (1-sub_phase)); call.set_warm_white(0.0);
            }
            call.set_brightness(1.0);
            call.perform();
      
      # TĘCZA
      - lambda:
          name: "Tęcza"
          update_interval: 200ms
          lambda: |-
            static float hue = 0.0;
            hue += 0.012;
            if (hue > 1.0) hue = 0.0;
            
            float r, g, b;
            float h = hue * 6.0;
            float c = 1.0;
            float x = 1.0 - fabs(fmod(h, 2.0) - 1.0);
            
            if (h < 1.0) { r = c; g = x; b = 0; }
            else if (h < 2.0) { r = x; g = c; b = 0; }
            else if (h < 3.0) { r = 0; g = c; b = x; }
            else if (h < 4.0) { r = 0; g = x; b = c; }
            else if (h < 5.0) { r = x; g = 0; b = c; }
            else { r = c; g = 0; b = x; }
            
            auto call = id(led_light).turn_on();
            call.set_state(true);
            call.set_transition_length(200);
            call.set_rgb(r, g, b);
            call.set_cold_white(0.0); call.set_warm_white(0.0);
            call.set_brightness(1.0);
            call.perform();
      
      # ŚWIECZKA
      - lambda:
          name: "Świeczka"
          update_interval: 120ms # Średni interwał
          lambda: |-
            auto call = id(led_light).turn_on();
            call.set_state(true);
            call.set_transition_length(40); // Krótka tranzycja = iskrzenie
            
            // Głównie ciepły biały z dodatkiem czerwieni (bursztyn)
            float base_warm = 0.8f;
            float flicker = ((rand() % 40) - 20) / 100.0f; // +/- 20% migotania
            float brightness = base_warm + flicker;
            
            // Ograniczenie zakresu
            if (brightness > 1.0) brightness = 1.0;
            if (brightness < 0.4) brightness = 0.4;
            
            // Okazjonalne "iskry" (biały błysk)
            float cold = 0.0f;
            if (rand() % 15 == 0) { // Co 15 cykli (średnio)
               cold = 0.3f; // Błysk zimnego
               brightness = 1.0f; // Max jasność
            }
            
            call.set_rgb(0.15f, 0.05f, 0.0f); // Lekka czerwień dla głębi
            call.set_cold_white(cold);
            call.set_warm_white(1.0f); // Zawsze dużo ciepłego
            call.set_brightness(brightness);
            call.perform();
      
      # MAKSYMALNA JASNOŚĆ
      - lambda:
          name: "Maksymalna Jasność"
          update_interval: 1s
          lambda: |-
            auto call = id(led_light).turn_on();
            call.set_state(true);
            call.set_transition_length(0);
            call.set_rgb(1.0, 1.0, 1.0);
            call.set_cold_white(1.0);
            call.set_warm_white(1.0);
            call.set_brightness(1.0);
            call.perform();

      # CZYTANIE (4200K - Neutral White)
      - lambda:
          name: "Czytanie"
          update_interval: 60s
          lambda: |-
            auto call = id(led_light).turn_on();
            call.set_state(true);
            call.set_transition_length(1000);
            // Mix dla uzyskania ok. 4200K - TYLKO BIAŁE KANAŁY
            // Wymuszamy 0.0 na RGB, aby wyłączyć diody kolorowe
            call.set_rgb(0.0f, 0.0f, 0.0f);
            call.set_cold_white(0.55f);
            call.set_warm_white(1.0f);
            call.set_brightness(0.9f);
            call.perform();

      # LAS
      - lambda:
          name: "Las"
          update_interval: 2s
          lambda: |-
            auto call = id(led_light).turn_on();
            call.set_state(true);
            call.set_transition_length(1800);
            float green_val = 0.4f + ((rand() % 60) / 100.0f);
            float warm_val = 0.1f + ((rand() % 30) / 100.0f);
            call.set_rgb(0.1, green_val, 0.0);
            call.set_cold_white(0.0);
            call.set_warm_white(warm_val);
            call.set_brightness(0.7);
            call.perform();

      # OCEAN (Ultra Slow Optimization)
      - lambda:
          name: "Ocean"
          update_interval: 2s
          lambda: |-
            static float phase = 0.0;
            phase += 0.05;
            if (phase > 1.0) phase = 0.0;
            
            float val = sin(phase * 6.28318); 
            float intensity = (val + 1.0) / 2.0; 
            
            auto call = id(led_light).turn_on();
            call.set_state(true);
            call.set_transition_length(2000);
            
            float b = 0.2f + (intensity * 0.8f);
            float g = intensity * 0.7f;
            float cw = (1.0f - intensity) * 0.8f;
            
            call.set_rgb(0.0, g, b);
            call.set_cold_white(cw);
            call.set_warm_white(0.0);
            call.set_brightness(1.0);
            call.perform();

      # IMPREZA
      - lambda:
          name: "Impreza"
          update_interval: 200ms
          lambda: |-
            auto call = id(led_light).turn_on();
            call.set_state(true);
            call.set_transition_length(50);
            int color = rand() % 6;
            if (color == 0) call.set_rgb(1.0, 0.0, 0.0);
            else if (color == 1) call.set_rgb(0.0, 1.0, 0.0);
            else if (color == 2) call.set_rgb(0.0, 0.0, 1.0);
            else if (color == 3) call.set_rgb(1.0, 1.0, 0.0);
            else if (color == 4) call.set_rgb(1.0, 0.0, 1.0);
            else call.set_rgb(0.0, 1.0, 1.0);
            call.set_cold_white(0.0); call.set_warm_white(0.0);
            call.set_brightness(1.0);
            call.perform();

      # ZACHÓD SŁOŃCA
      - lambda:
          name: "Zachód Słońca"
          update_interval: 200ms
          lambda: |-
            static float phase = 0.0;
            phase += 0.002;
            if (phase > 1.0) phase = 0.0;
            
            auto call = id(led_light).turn_on();
            call.set_state(true);
            call.set_transition_length(200);
            
            if (phase < 0.33) {
               float sub = phase * 3.0;
               call.set_rgb(1.0, sub * 0.5, 0.0);
            } 
            else if (phase < 0.66) {
               float sub = (phase - 0.33) * 3.0;
               call.set_rgb(1.0, 0.5 * (1.0 - sub), sub * 0.6); 
            }
            else {
               float sub = (phase - 0.66) * 3.0;
               call.set_rgb(1.0, 0.0, 0.6 * (1.0 - sub));
            }
            call.set_cold_white(0.0);
            call.set_warm_white(0.2);
            call.set_brightness(0.9);
            call.perform();

      # KOMINEK 1 (Zbalansowany - Smart Random)
      - lambda:
          name: "Kominek 1"
          update_interval: 100ms
          lambda: |-
             static uint32_t next_update = 0;
             uint32_t now = millis();

             if (now < next_update) return;

             auto call = id(led_light).turn_on();
             call.set_state(true);

             // 5% szans na iskrę
             if ((rand() % 20) == 0) {
                call.set_transition_length(30); 
                call.set_rgb(1.0, 0.5, 0.0); 
                call.set_cold_white(0.25);
                call.set_warm_white(1.0);
                call.set_brightness(1.0);
                next_update = now + 100 + (rand() % 100); 
             } 
             else {
                // Normalny ogień (0.3s - 1.0s)
                uint32_t duration = 300 + (rand() % 700);
                call.set_transition_length(duration);
                
                float r = 0.90f + ((rand() % 10) / 100.0f);
                float g = ((rand() % 12) / 100.0f);
                float w = 0.48f + ((rand() % 12) / 100.0f); // Jasny podkład
                
                call.set_rgb(r, g, 0.0);
                call.set_cold_white(0.0);
                call.set_warm_white(w);
                call.set_brightness(0.80f + ((rand() % 15) / 100.0f));
                next_update = now + duration;
             }
             call.perform();

      # ŻAR (Dawniej Kominek 2 - Spokojny Żar - Wolny, Czerwony)
      - lambda:
          name: "Żar"
          update_interval: 200ms
          lambda: |-
             auto call = id(led_light).turn_on();
             call.set_state(true);
             call.set_transition_length(200); // Pełna płynność

             // Tylko głęboka czerwień i trochę ciepłego
             float r = 0.95f + ((rand() % 5) / 100.0f);
             float g = ((rand() % 5) / 100.0f); // Prawie brak zieleni
             float w = 0.20f + ((rand() % 10) / 100.0f); // Ciemny ciepły

             call.set_rgb(r, g, 0.0);
             call.set_cold_white(0.0);
             call.set_warm_white(w);
             
             // Ciemniejszy efekt (0.6 - 0.7)
             call.set_brightness(0.6f + ((rand() % 10) / 100.0f));
             call.perform();

      # KOMINEK 3 (Dynamiczne Ognisko - Szybki, Żółty)
      - lambda:
          name: "Kominek 3"
          update_interval: 80ms
          lambda: |-
             static uint32_t next_update = 0;
             uint32_t now = millis();
             if (now < next_update) return;

             auto call = id(led_light).turn_on();
             call.set_state(true);

             // 5% szans na iskrę (rzadziej: rand % 20)
             if ((rand() % 20) == 0) {
                call.set_transition_length(20); 
                call.set_rgb(1.0, 0.6, 0.0); 
                call.set_cold_white(0.5); // Mocniejsza iskra
                call.set_warm_white(1.0);
                // Iskra max 60% jasności (minimalnie jaśniejsza od tła 0.5)
                call.set_brightness(0.6);
                next_update = now + 80 + (rand() % 50); 
             } else {
                // Szybsze zmiany (0.1s - 0.5s)
                uint32_t duration = 100 + (rand() % 400);
                call.set_transition_length(duration);
                
                // Więcej żółtego (green component)
                float r = 0.80f + ((rand() % 20) / 100.0f);
                float g = 0.10f + ((rand() % 20) / 100.0f); // Do 0.30 green
                float w = 0.30f + ((rand() % 20) / 100.0f);
                
                call.set_rgb(r, g, 0.0);
                call.set_cold_white(0.0);
                call.set_warm_white(w);
                // Tło ciemniejsze (0.5) żeby iskra (0.6) była widoczna
                call.set_brightness(0.5);
                next_update = now + duration;
             }
             call.perform();

      # KOMINEK 4 (Jasny Domowy - Stabilny)
      - lambda:
          name: "Kominek 4"
          update_interval: 150ms
          lambda: |-
             auto call = id(led_light).turn_on();
             call.set_state(true);
             call.set_transition_length(150);

             // Dominacja Warm White
             // Fluktuacja KOLORU (Czerwony <-> Pomarańczowy)
             // Red stały wysoki, Green fluktuuje (0.0 - 0.5)
             // Orange to R=1, G=0.5. Red to R=1, G=0.
             
             float g = (rand() % 51) / 100.0f; // 0.00 - 0.50
             float w = 0.80f + ((rand() % 20) / 100.0f); // Bardzo jasny biały (0.8-1.0)

             call.set_rgb(1.0, g, 0.0);
             call.set_cold_white(0.0);
             call.set_warm_white(w);
             call.set_brightness(0.95); // Prawie max jasność stale
             call.perform();

      # KOMINEK 5 (Agresywny - Test "Trzaskania")
      - lambda:
          name: "Kominek 5"
          update_interval: 100ms
          lambda: |-
             static uint32_t next_update = 0;
             uint32_t now = millis();
             if (now < next_update) return;

             auto call = id(led_light).turn_on();
             call.set_state(true);

             // Krótkie czasy trwania (50ms - 200ms)
             uint32_t duration = 50 + (rand() % 150);
             call.set_transition_length(duration / 2); // Tranzycja krótsza niż trwanie = skok

             float r = 0.8f + ((rand() % 20) / 100.0f);
             float g = ((rand() % 10) / 100.0f);
             float w = 0.2f + ((rand() % 80) / 100.0f); // Duże skoki ciepłego białego

             call.set_rgb(r, g, 0.0);
             call.set_cold_white(0.0);
             call.set_warm_white(w);
             
             // Duże skoki jasności
             if (rand() % 3 == 0) call.set_brightness(0.6);
             else call.set_brightness(1.0);

             next_update = now + duration;
             call.perform();

      # CYBERPUNK
      - lambda:
          name: "Cyberpunk"
          update_interval: 150ms
          lambda: |-
            static float phase = 0.0;
            phase += 0.02;
            if (phase > 1.0) phase = 0.0;
            float val = sin(phase * 6.28318); 
            float mix = (val + 1.0) / 2.0;
            auto call = id(led_light).turn_on();
            call.set_state(true);
            call.set_transition_length(150);
            call.set_rgb(1.0 - mix, mix, 1.0);
            call.set_cold_white(0.1);
            call.set_warm_white(0.0);
            call.set_brightness(1.0);
            call.perform();

      # MEDYTACJA
      - lambda:
          name: "Medytacja"
          update_interval: 150ms
          lambda: |-
            static float phase = 0.0;
            phase += 0.01;
            if (phase > 1.0) phase = 0.0;
            float val = sin(phase * 6.28318); 
            float breath = (val + 1.0) / 2.0; 
            float brightness = 0.2f + (breath * 0.8f);
            auto call = id(led_light).turn_on();
            call.set_state(true);
            call.set_transition_length(150);
            call.set_rgb(0.1, 0.0, 0.0);
            call.set_cold_white(0.0);
            call.set_warm_white(1.0);
            call.set_brightness(brightness);
            call.perform();

# ============================================================================
# PRZYCISKI DOTYKOWE TTP223
# ============================================================================

binary_sensor:
  # Przycisk lewy - GPIO0 (ściemnianie / wyłączanie)
  - platform: gpio
    pin:
      number: GPIO1
      mode:
        input: true
        pulldown: true
    name: "${friendly_name} Przycisk Lewy"
    id: button_left
    internal: false
    
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    
    on_press:
      then:
        - logger.log: "Lewy przycisk naciśnięty"
        # Sprawdź czy oba przyciski są wciśnięte jednocześnie
        - if:
            condition:
              and:
                - binary_sensor.is_on: button_right
                - not:
                    script.is_running: check_buttons_long_press
            then:
              - script.execute: check_buttons_long_press
    
    on_click:
      # Pojedyncze kliknięcie - ściemnianie
      - min_length: 50ms
        max_length: 2000ms
        then:
          - if:
              condition:
                lambda: 'return !id(buttons_locked);'
              then:
                - logger.log: "Lewy przycisk - ściemnianie"
                - light.dim_relative:
                    id: led_light
                    relative_brightness: -15%
                    transition_length: 0.5s
              else:
                - logger.log: "Przycisk zablokowany"
    
    # Przytrzymanie 3 sekundy - wyłączenie lampy
    on_multi_click:
      - timing:
          - ON for at least 3s
        then:
          - if:
              condition:
                lambda: 'return !id(buttons_locked);'
              then:
                - logger.log: "Wyłączanie lampy (3s)"
                - light.turn_off: led_light
              else:
                - logger.log: "Wyłączanie zablokowane"
  
  # Przycisk prawy - GPIO1 (rozjaśnianie / włączanie)
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pulldown: true
    name: "${friendly_name} Przycisk Prawy"
    id: button_right
    internal: false
    
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    
    on_press:
      then:
        - logger.log: "Prawy przycisk naciśnięty"
        - if:
            condition:
              and:
                - binary_sensor.is_on: button_left
                - not:
                    script.is_running: check_buttons_long_press
            then:
              - script.execute: check_buttons_long_press
    
    on_click:
      - min_length: 50ms
        max_length: 2000ms
        then:
          - if:
              condition:
                lambda: 'return !id(buttons_locked);'
              then:
                - if:
                    condition:
                      light.is_off: led_light
                    then:
                      - logger.log: "Light OFF -> Turning ON Whites Only"
                      - lambda: |-
                          auto call = id(led_light).turn_on();
                          call.set_effect("None");
                          call.set_brightness(0.15);
                          call.set_rgb(0.0, 0.0, 0.0);
                          call.set_cold_white(1.0);
                          call.set_warm_white(1.0);
                          call.set_transition_length(1000);
                          call.perform();
                          // Wymuszenie wyłączenia RGB bezpośrednio na wyjściach
                          id(output_red).set_level(0.0);
                          id(output_green).set_level(0.0);
                          id(output_blue).set_level(0.0);
                    else:
                      - logger.log: "Prawy przycisk - rozjaśnianie (+15%)"
                      - light.dim_relative:
                          id: led_light
                          relative_brightness: 15%
                          transition_length: 0.5s
              else:
                - logger.log: "Przycisk zablokowany"

