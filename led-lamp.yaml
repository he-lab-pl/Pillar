# ============================================================================
# Home Element Lab - Pillar (HE-L Pillar)
# ESPHome Configuration for RGBCCT LED Lamp
# Board: ESP32-C3 Super Mini
# ============================================================================

substitutions:
  device_name: "he-l-pillar"
  friendly_name: "HE-L Pillar"
  pwm_frequency: "4000Hz"
  ap_ssid: "HE-L Pillar Setup"
  ota_password: ""

# ============================================================================
# CORE CONFIGURATION
# ============================================================================

dashboard_import:
  package_import_url: github://he-lab-pl/Pillar/led-lamp.yaml@main
  import_full_config: false

esphome:
  name: ${device_name}
  name_add_mac_suffix: true
  
  project:
    name: "home-element-lab.pillar"
    version: "1.8a"

  on_boot:
    priority: 600
    then:
      - light.turn_off: led_light
      - output.turn_off: buzzer_output

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# ============================================================================
# NETWORK
# ============================================================================

wifi:
  ap:
    ssid: "${ap_ssid}"
    manual_ip:
      static_ip: 192.168.4.1
      gateway: 192.168.4.1
      subnet: 255.255.255.0

  fast_connect: false
  output_power: 8.5dB
  reboot_timeout: 0s
  
  networks:

esp32_improv:
  authorizer: none

captive_portal:

http_request:

api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: "${ota_password}"
    on_begin:
      then:
        - light.turn_off:
            id: led_light
            transition_length: 0s
  - platform: http_request
    on_begin:
      then:
        - light.turn_off:
            id: led_light
            transition_length: 0s

logger:
  level: VERBOSE
  hardware_uart: USB_CDC

web_server:
  port: 80

update:
  - platform: http_request
    name: "${friendly_name} Firmware"
    source: https://raw.githubusercontent.com/he-lab-pl/Pillar/main/manifest.json
    update_interval: 6h
    id: firmware_update_entity


# ============================================================================
# HARDWARE
# ============================================================================

output:
  # Warm White
  - platform: ledc
    pin: GPIO3
    frequency: ${pwm_frequency}
    id: output_warm_white
    
  # Cold White
  - platform: ledc
    pin: GPIO4
    frequency: ${pwm_frequency}
    id: output_cold_white
    
  # Green
  - platform: ledc
    pin: GPIO5
    frequency: ${pwm_frequency}
    id: output_green
    
  # Red
  - platform: ledc
    pin: GPIO6
    frequency: ${pwm_frequency}
    id: output_red
    
  # Blue
  - platform: ledc
    pin: GPIO10
    frequency: ${pwm_frequency}
    id: output_blue
    max_power: 0.8

  # Buzzer
  - platform: ledc
    pin: GPIO7
    id: buzzer_output
    frequency: 2500Hz

rtttl:
  output: buzzer_output
  id: buzzer_rtttl
  gain: 60%

# ============================================================================
# CONTROLS
# ============================================================================

button:
  - platform: restart
    id: restart_button
    name: "${friendly_name} Restart"

  - platform: template
    name: "${friendly_name} Update Check"
    on_press:
      - component.update: firmware_update_entity

globals:
  - id: sound_enabled
    type: bool
    restore_value: true
    initial_value: 'true'
  
  - id: buzzer_volume_level
    type: float
    restore_value: true
    initial_value: '1.0'
  
  - id: buttons_locked
    type: bool
    restore_value: true
    initial_value: 'false'

  # State restoration variables
  - id: saved_brightness
    type: float
    initial_value: '0.0'
  - id: saved_red
    type: float
    initial_value: '0.0'
  - id: saved_green
    type: float
    initial_value: '0.0'
  - id: saved_blue
    type: float
    initial_value: '0.0'
  - id: saved_cold_white
    type: float
    initial_value: '0.0'
  - id: saved_warm_white
    type: float
    initial_value: '0.0'
  - id: saved_state
    type: bool
    initial_value: 'false'

  - id: sleep_timer_minutes
    type: int
    restore_value: false
    initial_value: '0'

number:
  - platform: template
    name: "${friendly_name} Buzzer Volume"
    id: buzzer_volume_slider
    icon: "mdi:volume-high"
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 100
    set_action:
      - globals.set:
          id: buzzer_volume_level
          value: !lambda 'return x / 100.0;'
      - script.execute: buzzer_test_beep

switch:
  - platform: template
    name: "${friendly_name} Sounds"
    id: sound_enabled_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:volume-source"
    turn_on_action:
      - globals.set:
          id: sound_enabled
          value: 'true'
      - script.execute: buzzer_beep
    turn_off_action:
      - globals.set:
          id: sound_enabled
          value: 'false'
    lambda: |-
      return id(sound_enabled);

  - platform: template
    name: "${friendly_name} Button Lock"
    id: buttons_lock_switch
    icon: "mdi:lock"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - globals.set:
          id: buttons_locked
          value: 'true'
    turn_off_action:
      - globals.set:
          id: buttons_locked
          value: 'false'
    lambda: |-
      return id(buttons_locked);

select:
  - platform: template
    name: "${friendly_name} Sleep Timer"
    id: sleep_timer
    icon: "mdi:timer-outline"
    optimistic: true
    options:
      - "Off"
      - "1 min"
      - "5 min"
      - "10 min"
      - "20 min"
      - "30 min"
      - "45 min"
      - "60 min"
      - "90 min"
    initial_option: "Off"
    set_action:
      - lambda: |-
          std::string sel = x;
          int minutes = 0;
          if (sel == "1 min") minutes = 1;
          else if (sel == "5 min") minutes = 5;
          else if (sel == "10 min") minutes = 10;
          else if (sel == "20 min") minutes = 20;
          else if (sel == "30 min") minutes = 30;
          else if (sel == "45 min") minutes = 45;
          else if (sel == "60 min") minutes = 60;
          else if (sel == "90 min") minutes = 90;
          
          if (minutes > 0) {
            id(sleep_timer_minutes) = minutes;
            id(timer_countdown).execute();
          } else {
            id(timer_countdown).stop();
          }

# ============================================================================
# LOGIC
# ============================================================================

script:
  # Sleep Timer Logic
  - id: timer_countdown
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(sleep_timer_minutes) > 0;'
          then:
            - delay: 60s
            - lambda: 'id(sleep_timer_minutes) -= 1;'
      
      - light.turn_on:
          id: led_light
          effect: "None"
      - light.turn_off:
          id: led_light
          transition_length: 60s
      - lambda: 'id(sleep_timer).publish_state("Off");'

  # Audio Feedback
  - id: buzzer_beep
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(sound_enabled);'
          then:
            - output.turn_on: buzzer_output
            - output.set_level:
                id: buzzer_output
                level: !lambda 'return id(buzzer_volume_level) * 0.5;' 
            - delay: 100ms
            - output.turn_off: buzzer_output
            
  - id: buzzer_test_beep
    mode: restart
    then:
      - output.turn_on: buzzer_output
      - output.set_level:
          id: buzzer_output
          level: !lambda 'return id(buzzer_volume_level) * 0.5;'
      - delay: 150ms
      - output.turn_off: buzzer_output

  - id: buzzer_success
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(sound_enabled);'
          then:
            - rtttl.play: "success:d=4,o=5,b=200:8c,8e,8g,8c6"

  - id: buzzer_lock_on
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(sound_enabled);'
          then:
            - rtttl.play: "lock_on:d=16,o=5,b=200:4c,4g4"

  - id: buzzer_lock_off
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(sound_enabled);'
          then:
            - rtttl.play: "lock_off:d=16,o=5,b=200:4g4,4c"

  # Visual Feedback
  - id: blink_blue_confirmation
    mode: single
    then:
      - repeat:
          count: 3
          then:
            - light.turn_on:
                id: led_light
                transition_length: 0.1s
                brightness: 100%
                red: 0%
                green: 0%
                blue: 100%
                cold_white: 0%
                warm_white: 0%
            - delay: 0.3s
            - light.turn_off:
                id: led_light
                transition_length: 0.1s
            - delay: 0.3s

  - id: blink_amber_lock
    mode: single
    then:
      - lambda: |-
          auto call = id(led_light).current_values;
          id(saved_state) = call.is_on();
          id(saved_brightness) = call.get_brightness();
          id(saved_red) = call.get_red();
          id(saved_green) = call.get_green();
          id(saved_blue) = call.get_blue();
          id(saved_cold_white) = call.get_cold_white();
          id(saved_warm_white) = call.get_warm_white();
      
      - repeat:
          count: 3
          then:
            - light.turn_on:
                id: led_light
                transition_length: 0.1s
                brightness: 100%
                red: 100%
                green: 75%
                blue: 0%
                cold_white: 0%
                warm_white: 0%
            - delay: 0.3s
            - light.turn_off:
                id: led_light
                transition_length: 0.1s
            - delay: 0.3s

      - lambda: |-
          if (id(saved_state)) {
            auto call = id(led_light).turn_on();
            call.set_transition_length(200);
            call.set_brightness(id(saved_brightness));
            call.set_red(id(saved_red));
            call.set_green(id(saved_green));
            call.set_blue(id(saved_blue));
            call.set_cold_white(id(saved_cold_white));
            call.set_warm_white(id(saved_warm_white));
            call.perform();
          } else {
            auto call = id(led_light).turn_off();
            call.set_transition_length(200);
            call.perform();
          }

  - id: toggle_button_lock
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(buttons_locked);'
          then:
            - switch.turn_off: buttons_lock_switch
            - script.execute: buzzer_lock_off
            - script.execute: blink_amber_lock
          else:
            - switch.turn_on: buttons_lock_switch
            - script.execute: buzzer_lock_on
            - script.execute: blink_amber_lock

  # WiFi Reset Logic
  - id: force_ap_mode
    mode: single
    then:
      - script.execute: buzzer_success
      - delay: 1s
      - lambda: |-
          wifi::global_wifi_component->save_wifi_sta("", "");
      - script.execute: blink_blue_confirmation
      - delay: 3s
      - button.press: restart_button
  
  - id: check_buttons_long_press
    mode: restart
    then:
      - delay: 7s
      - if:
          condition:
            and:
              - binary_sensor.is_on: button_left
              - binary_sensor.is_on: button_right
          then:
            - script.execute: force_ap_mode

# ============================================================================
# LIGHT
# ============================================================================

light:
  - platform: rgbww
    name: "${friendly_name}"
    id: led_light
    
    red: output_red
    green: output_green
    blue: output_blue
    cold_white: output_cold_white
    warm_white: output_warm_white
    
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K
    
    color_interlock: false
    default_transition_length: 1s
    restore_mode: RESTORE_DEFAULT_OFF
    
    effects:
      # AURORA
      - lambda:
          name: "Zorza"
          update_interval: 2s
          lambda: |-
            static float phase = 0.0;
            phase += 0.05;
            if (phase > 1.0) phase = 0.0;
            
            auto call = id(led_light).turn_on();
            call.set_state(true);
            call.set_transition_length(2000);
            
            if (phase < 0.25) {
              float sub_phase = phase * 4.0;
              call.set_rgb(0.5 * (1-sub_phase), 0.0, 1.0);
              call.set_cold_white(0.0); call.set_warm_white(0.0);
            } else if (phase < 0.5) {
              float sub_phase = (phase - 0.25) * 4.0;
              call.set_rgb(0.0, sub_phase, 1.0 * (1-sub_phase));
              call.set_cold_white(0.0); call.set_warm_white(0.0);
            } else if (phase < 0.75) {
              float sub_phase = (phase - 0.5) * 4.0;
              call.set_rgb(0.0, 1.0 * (1-sub_phase), 0.0);
              call.set_cold_white(sub_phase); call.set_warm_white(0.0);
            } else {
              float sub_phase = (phase - 0.75) * 4.0;
              call.set_rgb(0.5 * sub_phase, 0.0, 1.0 * sub_phase);
              call.set_cold_white(1.0 * (1-sub_phase)); call.set_warm_white(0.0);
            }
            call.set_brightness(1.0);
            call.perform();
      
      # RAINBOW
      - lambda:
          name: "Tęcza"
          update_interval: 200ms
          lambda: |-
            static float hue = 0.0;
            hue += 0.012;
            if (hue > 1.0) hue = 0.0;
            
            float r, g, b;
            float h = hue * 6.0;
            float c = 1.0;
            float x = 1.0 - fabs(fmod(h, 2.0) - 1.0);
            
            if (h < 1.0) { r = c; g = x; b = 0; }
            else if (h < 2.0) { r = x; g = c; b = 0; }
            else if (h < 3.0) { r = 0; g = c; b = x; }
            else if (h < 4.0) { r = 0; g = x; b = c; }
            else if (h < 5.0) { r = x; g = 0; b = c; }
            else { r = c; g = 0; b = x; }
            
            auto call = id(led_light).turn_on();
            call.set_state(true);
            call.set_transition_length(200);
            call.set_rgb(r, g, b);
            call.set_cold_white(0.0); call.set_warm_white(0.0);
            call.set_brightness(1.0);
            call.perform();
      
      # CANDLE
      - lambda:
          name: "Świeczka"
          update_interval: 120ms
          lambda: |-
            static float target_level = 0.85f;
            static float smooth_level = 0.85f;
            static float smooth_red = 0.25f;
            static float smooth_yellow = 0.2f;
            static float smooth_warm = 0.85f;
            static uint32_t last_burst = 0;

            uint32_t now = millis();
            float small_noise = ((rand() % 11) - 5) / 100.0f;
            target_level += small_noise;
            target_level = max(0.65f, min(1.0f, target_level));

            if (now - last_burst > (rand() % 1700 + 800)) {
              target_level = max(0.75f, min(1.0f, target_level + (rand() % 11 + 5) / 100.0f));
              last_burst = now;
            }

            const float smoothing = 0.15f;
            smooth_level = smooth_level + smoothing * (target_level - smooth_level);

            float red_target = smooth_level * 0.35f;
            float yellow_target = smooth_level * 0.25f;
            float warm_target = smooth_level;

            red_target += ((rand() % 5) - 2) / 100.0f;
            yellow_target += ((rand() % 5) - 2) / 100.0f;

            smooth_red = smooth_red + 0.15f * (red_target - smooth_red);
            smooth_yellow = smooth_yellow + 0.15f * (yellow_target - smooth_yellow);
            smooth_warm = smooth_warm + 0.15f * (warm_target - smooth_warm);

            smooth_red = max(0.0f, min(1.0f, smooth_red));
            smooth_yellow = max(0.0f, min(1.0f, smooth_yellow));
            smooth_warm = max(0.0f, min(1.0f, smooth_warm));

            auto call = id(led_light).turn_on();
            call.set_state(true);
            call.set_transition_length(110);
            call.set_rgb(smooth_red, smooth_yellow * 0.5f, 0.0f);
            call.set_cold_white(0.0f);
            call.set_warm_white(smooth_warm);
            call.set_brightness(smooth_level);
            call.perform();
      
      # MAX BRIGHTNESS
      - lambda:
          name: "Maksymalna Jasność"
          update_interval: 1s
          lambda: |-
            auto call = id(led_light).turn_on();
            call.set_state(true);
            call.set_transition_length(0);
            call.set_rgb(1.0, 1.0, 1.0);
            call.set_cold_white(1.0);
            call.set_warm_white(1.0);
            call.set_brightness(1.0);
            call.perform();

      # READING
      - lambda:
          name: "Czytanie"
          update_interval: 60s
          lambda: |-
            auto call = id(led_light).turn_on();
            call.set_state(true);
            call.set_transition_length(1000);
            call.set_rgb(1.0f, 0.698f, 0.0f);
            call.set_cold_white(0.55f);
            call.set_warm_white(1.0f);
            call.set_brightness(0.9f);
            call.perform();

      # FOREST
      - lambda:
          name: "Las"
          update_interval: 2s
          lambda: |-
            auto call = id(led_light).turn_on();
            call.set_state(true);
            call.set_transition_length(1800);
            float green_val = 0.4f + ((rand() % 60) / 100.0f);
            float warm_val = 0.1f + ((rand() % 30) / 100.0f);
            call.set_rgb(0.1, green_val, 0.0);
            call.set_cold_white(0.0);
            call.set_warm_white(warm_val);
            call.set_brightness(0.7);
            call.perform();

      # OCEAN
      - lambda:
          name: "Ocean"
          update_interval: 2s
          lambda: |-
            static float phase = 0.0;
            phase += 0.05;
            if (phase > 1.0) phase = 0.0;
            
            float val = sin(phase * 6.28318); 
            float intensity = (val + 1.0) / 2.0; 
            
            auto call = id(led_light).turn_on();
            call.set_state(true);
            call.set_transition_length(2000);
            
            float b = 0.2f + (intensity * 0.8f);
            float g = intensity * 0.7f;
            float cw = (1.0f - intensity) * 0.8f;
            
            call.set_rgb(0.0, g, b);
            call.set_cold_white(cw);
            call.set_warm_white(0.0);
            call.set_brightness(1.0);
            call.perform();

      # PARTY
      - lambda:
          name: "Impreza"
          update_interval: 300ms
          lambda: |-
            auto call = id(led_light).turn_on();
            call.set_state(true);
            call.set_transition_length(50);
            int color = rand() % 6;
            if (color == 0) call.set_rgb(1.0, 0.0, 0.0);
            else if (color == 1) call.set_rgb(0.0, 1.0, 0.0);
            else if (color == 2) call.set_rgb(0.0, 0.0, 1.0);
            else if (color == 3) call.set_rgb(1.0, 1.0, 0.0);
            else if (color == 4) call.set_rgb(1.0, 0.0, 1.0);
            else call.set_rgb(0.0, 1.0, 1.0);
            call.set_cold_white(0.0); call.set_warm_white(0.0);
            call.set_brightness(1.0);
            call.perform();

      # SUNSET
      - lambda:
          name: "Zachód Słońca"
          update_interval: 200ms
          lambda: |-
            static float phase = 0.0;
            phase += 0.002;
            if (phase > 1.0) phase = 0.0;
            
            auto call = id(led_light).turn_on();
            call.set_state(true);
            call.set_transition_length(200);
            
            if (phase < 0.33) {
               float sub = phase * 3.0;
               call.set_rgb(1.0, sub * 0.5, 0.0);
            } 
            else if (phase < 0.66) {
               float sub = (phase - 0.33) * 3.0;
               call.set_rgb(1.0, 0.5 * (1.0 - sub), sub * 0.6); 
            }
            else {
               float sub = (phase - 0.66) * 3.0;
               call.set_rgb(1.0, 0.0, 0.6 * (1.0 - sub));
            }
            call.set_cold_white(0.0);
            call.set_warm_white(0.2);
            call.set_brightness(0.9);
            call.perform();

      # FIREPLACE 1
      - lambda:
          name: "Kominek 1"
          update_interval: 150ms
          lambda: |-
             static uint32_t next_update = 0;
             uint32_t now = millis();

             if (now < next_update) return;

             auto call = id(led_light).turn_on();
             call.set_state(true);

             if ((rand() % 50) == 0) {
                call.set_transition_length(30); 
                call.set_rgb(1.0, 0.5, 0.0); 
                call.set_cold_white(0.03);
                call.set_warm_white(0.6);
                call.set_brightness(1.0);
                next_update = now + 100 + (rand() % 100); 
             } 
             else {
                uint32_t duration = 500 + (rand() % 1000);
                call.set_transition_length(duration);
                
                float r = 0.90f + ((rand() % 10) / 100.0f);
                float g = ((rand() % 12) / 100.0f);
                float w = 0.48f + ((rand() % 12) / 100.0f);
                
                call.set_rgb(r, g, 0.0);
                call.set_cold_white(0.0);
                call.set_warm_white(w);
                call.set_brightness(0.80f + ((rand() % 15) / 100.0f));
                next_update = now + duration;
             }
             call.perform();

      # FIREPLACE 2
      - lambda:
          name: "Kominek 2"
          update_interval: 300ms
          lambda: |-
             auto call = id(led_light).turn_on();
             call.set_state(true);
             call.set_transition_length(300);

             float g = (rand() % 51) / 100.0f;
             float w = 0.80f + ((rand() % 20) / 100.0f);

             call.set_rgb(1.0, g, 0.0);
             call.set_cold_white(0.0);
             call.set_warm_white(w);
             call.set_brightness(0.95);
             call.perform();

      # EMBER
      - lambda:
          name: "Żar"
          update_interval: 200ms
          lambda: |-
             auto call = id(led_light).turn_on();
             call.set_state(true);
             call.set_transition_length(200);

             float r = 0.95f + ((rand() % 5) / 100.0f);
             float g = ((rand() % 5) / 100.0f);
             float w = 0.20f + ((rand() % 10) / 100.0f);

             call.set_rgb(r, g, 0.0);
             call.set_cold_white(0.0);
             call.set_warm_white(w);
             
             call.set_brightness(0.6f + ((rand() % 10) / 100.0f));
             call.perform();

# ============================================================================
# SENSORS
# ============================================================================

sensor:
  - platform: uptime
    name: "${friendly_name} Uptime"
    update_interval: 5min

  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 5min

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
    ssid:
      name: "${friendly_name} SSID"

binary_sensor:
  # Left Button
  - platform: gpio
    pin:
      number: GPIO1
      mode:
        input: true
        pulldown: true
    name: "${friendly_name} Left Button"
    id: button_left
    internal: false
    
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    
    on_press:
      then:
        - if:
            condition:
              and:
                - binary_sensor.is_on: button_right
                - not:
                    script.is_running: check_buttons_long_press
            then:
              - script.execute: check_buttons_long_press
    
    on_click:
      # Single click - Dimming
      - min_length: 50ms
        max_length: 2000ms
        then:
          - if:
              condition:
                lambda: 'return !id(buttons_locked);'
              then:
                - light.dim_relative:
                    id: led_light
                    relative_brightness: -15%
                    transition_length: 0.5s
    
    # Hold 3s - Turn OFF
    on_multi_click:
      - timing:
          - ON for at least 3s
        then:
          - if:
              condition:
                lambda: 'return !id(buttons_locked);'
              then:
                - light.turn_off: led_light
  
  # Right Button
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pulldown: true
    name: "${friendly_name} Right Button"
    id: button_right
    internal: false
    
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    
    on_press:
      then:
        - if:
            condition:
              and:
                - binary_sensor.is_on: button_left
                - not:
                    script.is_running: check_buttons_long_press
            then:
              - script.execute: check_buttons_long_press
    
    on_click:
      - min_length: 50ms
        max_length: 2000ms
        then:
          - if:
              condition:
                lambda: 'return !id(buttons_locked);'
              then:
                - if:
                    condition:
                      light.is_off: led_light
                    then:
                      - lambda: |-
                          auto call = id(led_light).turn_on();
                          call.set_effect("None");
                          call.set_brightness(0.15);
                          call.set_rgb(1.0, 0.149, 0.0);
                          call.set_cold_white(1.0);
                          call.set_warm_white(1.0);
                          call.set_transition_length(1000);
                          call.perform();
                    else:
                      - light.dim_relative:
                          id: led_light
                          relative_brightness: 15%
                          transition_length: 0.5s


